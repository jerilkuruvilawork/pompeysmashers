name: Deploy Portsmouth Badminton Hub

on:
  push:
    branches: [main]
    paths:
      - "portsmouth-badminton-hub/**"
      - ".github/workflows/deploy-portsmouth-badminton-hub.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-portsmouth-badminton-hub
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portsmouth-badminton-hub/package-lock.json
      - name: Build
        working-directory: portsmouth-badminton-hub
        env:
          VITE_SITE_BASE: /pompeysmashers/portsmouth-badminton-hub/
        run: |
          npm ci
          npm run build
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: portsmouth-badminton-hub/dist
          target-folder: portsmouth-badminton-hub
          clean: false
